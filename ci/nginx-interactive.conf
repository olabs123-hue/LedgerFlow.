events {}
http {
  # Testable edge rate limit uses the actual connection address, not request headers.
  limit_req_zone $binary_remote_addr zone=auth_by_peer:10m rate=5r/s;
  limit_req_status 429;
  server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # ASGI app explicitly ignores client-supplied forwarding headers.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";

    location = /browser/session {
      limit_req zone=auth_by_peer burst=8 nodelay;
      proxy_pass http://api:8000;
    }
    location / {
      proxy_pass http://api:8000;
    }
  }
}
