services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: ledgerflow
      POSTGRES_DB: ledgerflow
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow"]
      interval: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ledgerflow:ledgerflow@db:5432/ledgerflow
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - '127.0.0.1:5173:5173'
    depends_on: [api]
volumes:
  postgres_data:
