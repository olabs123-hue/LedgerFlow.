name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: PYTHONPATH=. pytest -q tests/test_api.py tests/test_sessions.py tests/test_browser_sessions.py tests/test_auth_peer_limit.py tests/test_audit.py tests/test_production_guardrails.py
        env:
          DATABASE_URL: sqlite+pysqlite:///./ledgerflow_test.sqlite
          JWT_SECRET: integration-test-secret-string-32-bytes-minimum-only
          DEMO_MODE: 'true'
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledgerflow_test
          POSTGRES_USER: ledgerflow
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerflow -d ledgerflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://ledgerflow:test_only_password@localhost:5432/ledgerflow_test
      JWT_SECRET: integration-test-secret-string-32-bytes-minimum-only
      DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Apply migrations on fresh PostgreSQL
        run: alembic upgrade head
      - name: Assert migrated schema and revision
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          import os
          engine = create_engine(os.environ['DATABASE_URL'])
          tables = set(inspect(engine).get_table_names())
          assert {'users','accounts','transfers','journal_entries','login_attempts','revoked_tokens','auth_peer_buckets','alembic_version'} <= tables, tables
          with engine.connect() as conn:
              assert conn.execute(text('SELECT version_num FROM alembic_version')).scalar_one() == '0005_auth_peer_rate'
          print('Alembic migration schema verified')
          PY
      - name: Verify real PostgreSQL CHECK constraints reject invalid rows
        run: PYTHONPATH=. pytest -q tests/test_schema_integrity.py
      - name: Verify actual production-mode HTTP restrictions
        env:
          APP_ENV: production
          DEMO_MODE: 'false'
          ALLOW_REGISTRATION: 'false'
          JWT_SECRET: 'test-production-secret-with-more-than-48-characters-not-for-deployment'
          FRONTEND_ORIGIN: https://example.org
        run: PYTHONPATH=. pytest -q tests/test_production_runtime.py
      - name: Run concurrency scenarios with clean isolated fixtures
        run: PYTHONPATH=. pytest -q tests/test_pg_integration.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Build isolated same-origin cookie client
        env:
          VITE_COOKIE_AUTH_MODE: 'true'
        run: npm run build
