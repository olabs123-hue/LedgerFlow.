name: Public Showcase Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ledgerflow-pages
  cancel-in-progress: true

jobs:
  showcase:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build browser-only public showcase
        working-directory: frontend
        env:
          VITE_SHOWCASE_MODE: 'true'
          VITE_PUBLIC_BASE: '/LedgerFlow./'
        run: |
          npm install
          npm run build
      - name: Verify no API backend required
        working-directory: frontend
        run: |
          grep -q 'LedgerFlow' dist/index.html
          test -f dist/assets/$(find dist/assets -maxdepth 1 -name '*.js' -printf '%f\n' | head -1)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Publish showcase
        id: deployment
        uses: actions/deploy-pages@v4
