name: Docker Stack E2E

on:
  push:
  pull_request:

jobs:
  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated simulation environment
        shell: bash
        run: |
          {
            echo 'JWT_SECRET='$(openssl rand -hex 32)
            echo 'DEMO_MODE=true'
            echo 'FRONTEND_ORIGIN=http://localhost:5173'
          } > .env
          chmod 600 .env
      - name: Build and start all three services
        run: docker compose up --build -d
      - name: Verify browser entry point and simulated API transfers
        run: python3 scripts/smoke_e2e.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        working-directory: frontend
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Run real-browser desktop and mobile journeys
        working-directory: frontend
        run: npx playwright test
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore
      - name: Collect diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=120
      - name: Stop containers and erase test volume
        if: always()
        run: docker compose down --volumes --remove-orphans
