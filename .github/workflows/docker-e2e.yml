name: Docker Stack E2E

on:
  push:
  pull_request:

jobs:
  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated simulation environment
        shell: bash
        run: |
          {
            echo 'JWT_SECRET='$(openssl rand -hex 32)
            echo 'DEMO_MODE=true'
            echo 'FRONTEND_ORIGIN=http://localhost:5173'
          } > .env
          chmod 600 .env
      - name: Build and start all three services
        run: docker compose up --build -d
      - name: Verify browser entry point and simulated API transfers
        run: python3 scripts/smoke_e2e.py
      - name: Collect diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=120
      - name: Stop containers and erase test volume
        if: always()
        run: docker compose down --volumes --remove-orphans
